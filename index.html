<style>
    .carrusel-infinito {
  width: 100%;
  overflow: hidden;
  background-color: #f0f0f0; 
  padding: 20px 0;
  display: flex;
}

.carrusel-track {
  display: flex;
  width: max-content; 
  animation: desplazar 20s linear infinite; 
}

.carrusel-track:hover {
  animation-play-state: paused; 
}

.carrusel-item {
  width: 250px; 
  padding: 0 15px; 
  flex-shrink: 0;
}

.carrusel-item img {
  width: 100%;
  height: 200px; 
  object-fit: cover; 
  border-radius: 8px; 
}


@keyframes desplazar {
  0% {
    transform: translateX(0);
  }
  100% {

    transform: translateX(-50%); 
  }
}
</style>
